name: Release

# 推送版本標籤（例如 v0.6.0）時：跑測試、打包 .vsix，附到 GitHub Releases，
# 並發布到 VS Code Marketplace 與 Open VSX。
# 需要在 GitHub 專案的 Settings → Secrets and variables → Actions 設定：
#   VSCE_PAT：Azure DevOps 的存取權杖（Marketplace）
#   OVSX_PAT：Open VSX 的存取權杖
# 沒有設定的平台會略過（只打包與附到 Releases）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 確認標籤與 package.json 版本一致
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "標籤 ${GITHUB_REF_NAME} 與 package.json 版本 $v 不同"; exit 1
          fi
      - name: 型別檢查與單元測試
        run: npm test
      - name: 整合測試
        run: xvfb-run -a npm run test:integration
      - name: 打包 .vsix
        run: npx vsce package --no-dependencies -o function-bookmarks-${GITHUB_REF_NAME#v}.vsix
      - name: 附到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
      - name: 發布到 VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath function-bookmarks-${GITHUB_REF_NAME#v}.vsix
      - name: 發布到 Open VSX（Cursor 從這裡安裝）
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish function-bookmarks-${GITHUB_REF_NAME#v}.vsix -p "$OVSX_PAT"
